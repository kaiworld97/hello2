<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웨비나 신청</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }
    .container {
      max-width: 680px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    .banner {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }
    .content {
      padding: 32px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }
    .meta {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .description {
      margin-bottom: 28px;
      white-space: pre-line;
    }
    form label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    form input,
    form select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    form input:focus,
    form select:focus {
      outline: none;
      border-color: #4a6cf7;
    }
    .submit-btn {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      background-color: #4a6cf7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #3a5ae0;
    }
    .success {
      display: none;
      text-align: center;
      padding: 60px 32px;
    }
    .success h2 {
      color: #2e7d32;
      margin-bottom: 12px;
    }
    .success p {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 신청 폼 화면 -->
    <div id="form-view">
      <img class="banner"
           src="https://placehold.co/680x260?text=Webinar+Banner"
           alt="웨비나 이미지">

      <div class="content">
        <h1>2026 AI 활용 웨비나</h1>
        <div class="meta">
          📅 2026년 11월 15일 (일) 오후 2시 &nbsp;|&nbsp; 📍 온라인 (Zoom)
        </div>
        <div class="description">
이 웨비나에서는 업무에 AI를 실제로 적용하는 방법을 소개합니다.
생산성 도구 활용법, 실제 사례, 질의응답 시간이 포함되어 있습니다.
참가 대상: 업무 효율화에 관심 있는 누구나
        </div>

        <form id="register-form">
          <label for="name">이름 *</label>
          <input type="text" id="name" required placeholder="홍길동">

          <label for="email">이메일 *</label>
          <input type="email" id="email" required placeholder="example@email.com">

          <label for="phone">연락처</label>
          <input type="tel" id="phone" placeholder="010-1234-5678">

          <label for="company">소속 (회사/학교)</label>
          <input type="text" id="company" placeholder="소속을 입력하세요">

          <label for="job">직무</label>
          <select id="job">
            <option value="">선택하세요</option>
            <option>기획</option>
            <option>마케팅</option>
            <option>개발</option>
            <option>디자인</option>
            <option>경영/관리</option>
            <option>기타</option>
          </select>

          <button type="submit" class="submit-btn">웨비나 신청하기</button>
        </form>
      </div>
    </div>

    <!-- 신청 완료 화면 -->
    <div id="success-view" class="success">
      <h2>✅ 신청이 완료되었습니다!</h2>
      <p>입력하신 이메일로 참가 안내를 보내드리겠습니다.<br>웨비나에서 뵙겠습니다. 감사합니다.</p>
    </div>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('success-view').style.display = 'block';
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
